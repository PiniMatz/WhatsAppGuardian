name: Build Android APK

on:
  push:
    branches: [main, v1.1-update]
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_URL: ${{ vars.SERVER_URL }}
      DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version (continues from the APK you already have, versionCode 1)
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret KEYSTORE_BASE64 (see release-secrets/GITHUB_AND_RENDER_SECRETS.txt)."
            exit 1
          fi
          if [ -z "$DEVICE_TOKEN" ]; then
            echo "::warning::DEVICE_TOKEN secret is empty - the APK will not authenticate to a protected server."
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guardian-release.jks"

      - name: Build signed release APK
        working-directory: client
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/guardian-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and name the file
        id: apk
        run: |
          APK=$(ls client/app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose "$APK"
          NAME="WhatsAppGuardian-v1.1.${VERSION_CODE}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### Built $NAME" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${VERSION_CODE}" "${{ steps.apk.outputs.name }}" \
            --title "WhatsApp Guardian 1.1.${VERSION_CODE}" \
            --notes "Android app build ${VERSION_CODE}. Install this APK on the child's phone." 
